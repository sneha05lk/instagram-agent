name: Instagram Auto-Reply Bot

on:
  schedule:
    # Run at the top of every hour
    - cron: '0 * * * *'
  
  workflow_dispatch:
    inputs:
      post_url:
        description: 'Instagram Post/Reel URL'
        required: false
        type: string
      keyword:
        description: 'Trigger Keyword'
        required: false
        type: string
      reply_text:
        description: 'Reply Message Text'
        required: false
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for rebase and pushing

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Instagram Bot
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INPUT_POST_URL: ${{ inputs.post_url }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
          INPUT_REPLY: ${{ inputs.reply_text }}
        run: python agent.py

      - name: Commit and Push state changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the database files
          git add rules.json processed_comments.json
          
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD; then
            echo "✅ No state changes to commit."
          else
            echo "📝 Changes detected in JSON database. Committing..."
            git commit -m "chore: update bot state [skip ci]"
            
            # Pull with rebase to prevent race conditions if someone else pushed
            git pull --rebase origin main
            
            git push
            echo "🚀 State successfully pushed to repository."
          fi
