name: Instagram Bot Automations

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically every hour to check for new comments
  workflow_dispatch:
    inputs:
      post_url:
        description: 'Target Post URL (Leave blank to just run the bot)'
        required: false
        type: string
      keyword:
        description: 'Trigger Keyword (e.g. link)'
        required: false
        type: string
      reply_text:
        description: 'Public Reply Text'
        required: false
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Forces GitHub to fetch the full history, preventing conflicts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Agent
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # The inputs from the GitHub Web Form:
          INPUT_POST_URL: ${{ inputs.post_url }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
          INPUT_REPLY: ${{ inputs.reply_text }}
        run: python agent.py

      - name: Commit and Push state changes
        run: |
          git config --global user.name "github-actions[bot]"
           git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the database files
          git add rules.json processed_comments.json
          
          # Check if there are any changes to commit
          if git diff-index --quiet HEAD; then
            echo "✅ No state changes to commit."
          else
            echo "📝 Changes detected in JSON database. Committing..."
            git commit -m "chore: update bot state [skip ci]"
            
            # Pull with rebase, using '-X theirs' to automatically resolve 
            # conflicts by favoring the bot's latest local changes
            git pull --rebase -X theirs origin main
            
            git push
            echo "🚀 State successfully pushed to repository."
          fi
